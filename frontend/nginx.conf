server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API's own path prefixes, proxied so the app is served from one origin.
    location ~ ^/(monitors|runs|insights|openapi\.json|docs) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Client-side routing: unknown paths are React Router's, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
