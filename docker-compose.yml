# Local development dependencies only. These service names, ports, and credentials are
# not a production or deployment contract, and no process may treat them as a fallback:
# every endpoint is supplied to the application through runtime configuration.
#
# Required variables come from an explicit local environment file or shell settings; the
# `:?` form fails Compose instead of defaulting an endpoint or credential.
#
# PostgreSQL 16.15 / TimescaleDB 2.29.1 / pgvector 0.8.3 are the releases selected by the
# compatibility preflight. Redis has no preflight-verified server release, so only its
# major line is pinned here.

name: mlsc-local

services:
  postgres:
    image: timescale/timescaledb-ha:pg16.15-ts2.29.1
    labels:
      com.mlsc.scope: local-development-only
    environment:
      POSTGRES_DB: ${MLSC_LOCAL_POSTGRES_DB:?set MLSC_LOCAL_POSTGRES_DB in your local env file}
      POSTGRES_USER: ${MLSC_LOCAL_POSTGRES_USER:?set MLSC_LOCAL_POSTGRES_USER in your local env file}
      POSTGRES_PASSWORD: ${MLSC_LOCAL_POSTGRES_PASSWORD:?set MLSC_LOCAL_POSTGRES_PASSWORD in your local env file}
    ports:
      - "${MLSC_LOCAL_POSTGRES_PORT:?set MLSC_LOCAL_POSTGRES_PORT in your local env file}:5432"
    volumes:
      - postgres-data:/home/postgres/pgdata/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    labels:
      com.mlsc.scope: local-development-only
    command:
      - redis-server
      - --requirepass
      - ${MLSC_LOCAL_REDIS_PASSWORD:?set MLSC_LOCAL_REDIS_PASSWORD in your local env file}
    ports:
      - "${MLSC_LOCAL_REDIS_PORT:?set MLSC_LOCAL_REDIS_PORT in your local env file}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${MLSC_LOCAL_REDIS_PASSWORD:?set MLSC_LOCAL_REDIS_PASSWORD in your local env file}

volumes:
  postgres-data:
  redis-data:
